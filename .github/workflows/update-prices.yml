name: Update tomato prices
on:
  schedule:
    - cron: "30 13 * * *" # 19:00 IST, after most mandis have reported
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    env:
      DATA_GOV_API_KEY: ${{ secrets.DATA_GOV_API_KEY }}
    steps:
      # Until the key is added this job skips cleanly instead of failing every day.
      - id: key
        run: |
          if [ -n "$DATA_GOV_API_KEY" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Skipped: add a DATA_GOV_API_KEY repository secret to fetch real prices."
          fi
      - if: steps.key.outputs.ready == 'true'
        uses: actions/checkout@v4
      - if: steps.key.outputs.ready == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - if: steps.key.outputs.ready == 'true'
        run: pip install -r scripts/requirements.txt
      - if: steps.key.outputs.ready == 'true'
        run: python scripts/fetch_prices.py
      - if: steps.key.outputs.ready == 'true'
        run: python scripts/predict.py
      - if: steps.key.outputs.ready == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data
          git diff --cached --quiet || git commit -m "Update tomato prices"
          git push
